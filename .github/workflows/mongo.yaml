name: US_bankruptcy Workflow

on:
  push:
    branches:
      - main
  

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Debug env
      run: |
        echo "MONGODB_URL=$MONGODB_URL" | sed 's/./& /g'
      env:
        MONGODB_URL: ${{ secrets.MONGODB_URL }}

    - name: Run tests
      env:
        MONGODB_URL: ${{ secrets.MONGODB_URL }} 
      run: |
        pytest _test.py

    

