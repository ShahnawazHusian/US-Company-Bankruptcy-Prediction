name: US_bankruptcy Workflow

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest   # 👈 switch to Linux runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      env:
        MONGODB_URL: ${{ secrets.MONGODB_URL }}   # 👈 fix secret env
      run: pytest _test.py

    - name: Run Docker Image to serve users
      run: |
        docker pull shahnawazhusain/us-bnackruptcy-data-prediction:latest
        docker run -d \
          -e MONGODB_URL="${{ secrets.MONGODB_URL }}" \
          -p 5000:5000 \
          shahnawazhusain/us-bnackruptcy-data-prediction:latest
