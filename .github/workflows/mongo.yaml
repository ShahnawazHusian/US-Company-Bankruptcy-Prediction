name: US_bankruptcy_Workflow

on:
  push:
    branches:
      - main
  

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      env:
        MONGODB_URL: ${{ secrets.MONGODB_URL }}
      run: |
        if (-not $env:MONGODB_URL) {
          Write-Host "❌ MONGODB_URL is not set"
          exit 1
        } else {
          Write-Host "✅ MONGODB_URL is set"
        }
        pytest _test.py

      # this docker pull request will work with ubunt-latest

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Pull Docker Image
      run: docker pull shahnawazhusain/us-bnackruptcy-data-prediction:latest
      shell: powershell

    - name: Run Docker Image to serve users
      run: |
        docker run shahnawazhusain/us-bnackruptcy-data-prediction:latest
      shell: powershell
    

