<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Company Bankruptcy Prediction</title>
    <style>
        /* Reset some default browser styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f9;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 25px 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #2c3e50;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
        }

        input {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        input:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }

        .buttons {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .train-btn {
            background: #28a745;
            color: #fff;
        }

        .train-btn:hover {
            background: #218838;
        }

        .predict-btn {
            background: #007BFF;
            color: #fff;
        }

        .predict-btn:hover {
            background: #0056b3;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>US Company Bankruptcy Prediction</h1>
        <form method="post" action="/predict">
            <div class="form-group">
                <label for="current_assets">Current Assets</label>
                <input type="number" step="any" id="current_assets" name="current_assets" required>
            </div>

            <div class="form-group">
                <label for="cost_of_goods_sold">Cost of Goods Sold</label>
                <input type="number" step="any" id="cost_of_goods_sold" name="cost_of_goods_sold" required>
            </div>

            <div class="form-group">
                <label for="depreciation_and_amortization">Depreciation and Amortization</label>
                <input type="number" step="any" id="depreciation_and_amortization" name="depreciation_and_amortization" required>
            </div>

            <div class="form-group">
                <label for="ebditda">EBDITDA</label>
                <input type="number" step="any" id="ebditda" name="ebditda" required>
            </div>

            <div class="form-group">
                <label for="inventory">Inventory</label>
                <input type="number" step="any" id="inventory" name="inventory" required>
            </div>

            <div class="form-group">
                <label for="net_income">Net Income</label>
                <input type="number" step="any" id="net_income" name="net_income" required>
            </div>

            <div class="form-group">
                <label for="total_receivable">Total Receivable</label>
                <input type="number" step="any" id="total_receivable" name="total_receivable" required>
            </div>

            <div class="form-group">
                <label for="market_value">Market Value</label>
                <input type="number" step="any" id="market_value" name="market_value" required>
            </div>

            <div class="form-group">
                <label for="net_sales">Net Sales</label>
                <input type="number" step="any" id="net_sales" name="net_sales" required>
            </div>

            <div class="form-group">
                <label for="total_assets">Total Assets</label>
                <input type="number" step="any" id="total_assets" name="total_assets" required>
            </div>

            <div class="form-group">
                <label for="total_long_term_debt">Total Long Term Debt</label>
                <input type="number" step="any" id="total_long_term_debt" name="total_long_term_debt" required>
            </div>

            <div class="form-group">
                <label for="ebit">EBIT</label>
                <input type="number" step="any" id="ebit" name="ebit" required>
            </div>

            <div class="form-group">
                <label for="gross_profit">Gross Profit</label>
                <input type="number" step="any" id="gross_profit" name="gross_profit" required>
            </div>

            <div class="form-group">
                <label for="total_current_liabilitie">Total Current Liabilitie</label>
                <input type="number" step="any" id="total_current_liabilitie" name="total_current_liabilitie" required>
            </div>

            <div class="form-group">
                <label for="retained_earnings">Retained Earnings</label>
                <input type="number" step="any" id="retained_earnings" name="retained_earnings" required>
            </div>

            <div class="form-group">
                <label for="total_revenue">Total Revenue</label>
                <input type="number" step="any" id="total_revenue" name="total_revenue" required>
            </div>

            <div class="form-group">
                <label for="total_liabilities">Total Liabilities</label>
                <input type="number" step="any" id="total_liabilities" name="total_liabilities" required>
            </div>

            <div class="form-group">
                <label for="total_operating_expenses">Total Operating Expenses</label>
                <input type="number" step="any" id="total_operating_expenses" name="total_operating_expenses" required>
            </div>

            <div class="form-group">
                <label for="year">Year</label>
                <input type="number" id="year" name="year" required>
            </div>

            <div class="buttons">
                <button type="submit" formaction="/train" class="train-btn">Train Model</button>
                <button type="submit" formaction="/predict" class="predict-btn">Predict</button>
            </div>
        </form>

        {% if context %}
        <div class="result-box {{ 'success' if 'Yes' in context else 'error' }}">
            {{ context }}
        </div>
        {% endif %}
    </div>
</body>
</html>
